version: '3.8'

services:
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: pipelines
    ports:
      - "9099:9099"
    environment:
      - PIPELINES_URLS=
    restart: unless-stopped
    volumes:
      # - ./aicerag.py:/app/pipelines/aicerag.py  
      # - ./aiceberg_rag.py:/app/pipelines/aiceberg_rag.py 
      - ./custom_aiceberg.py:/app/pipelines/custom_aiceberg.py     
      - ./.env:/app/.env

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URLS=http://pipelines:9099
      - OPENAI_API_KEYS=0p3n-w3bu!
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_OLLAMA_API=False
      - OLLAMA_BASE_URLS=
      - DEFAULT_MODELS=aicerag
    restart: unless-stopped
    volumes:
      - open-webui:/app/backend/data
      - ./.env:/app/.env
    depends_on:
      - pipelines

volumes:
  open-webui: